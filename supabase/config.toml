# Supabase CLI configuration. Local settings only; hosted project settings are
# managed in the dashboard (Authentication → Sign In / Providers: turn OFF
# "Allow new users to sign up" — this app is invite-only).
project_id = "lineapp"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[studio]
enabled = true
port = 54323
